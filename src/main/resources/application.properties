# HTTP Port configuration (dynamically uses $PORT for Cloud Run/Cloud, fallback 7860)
quarkus.http.port=${PORT:7860}
quarkus.http.host=0.0.0.0

# Swagger UI & OpenAPI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, x-api-key, X-API-KEY
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD

# HTTP Basic Authentication & Users
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true

# Configurable User Credentials (admin / admin123, operator / operator123)
quarkus.security.users.embedded.users.admin=${ADMIN_PASSWORD:admin123}
quarkus.security.users.embedded.roles.admin=admin,operator

quarkus.security.users.embedded.users.operator=${OPERATOR_PASSWORD:operator123}
quarkus.security.users.embedded.roles.operator=operator

# Path-based Security Policies
quarkus.http.auth.policy.admin-role.roles-allowed=admin,operator

# 1. Protect Swagger UI & OpenAPI Specification (requires user/password)
quarkus.http.auth.permission.swagger.paths=/q/swagger-ui*,/q/openapi*
quarkus.http.auth.permission.swagger.policy=admin-role

# 2. Protect Operator Console (control.html) (requires user/password)
quarkus.http.auth.permission.control.paths=/control.html
quarkus.http.auth.permission.control.policy=admin-role

# 3. Public Frontend Display UI & Read-only API Endpoints
quarkus.http.auth.permission.public.paths=/,/index.html,/css/*,/js/*,/api/traffic-light/state,/api/traffic-light/mode,/api/traffic-light/modes,/api/traffic-light/colors,/api/traffic-light/states,/api/traffic-light/events
quarkus.http.auth.permission.public.policy=permit

# Default Seed API Keys
traffic.keys.default-admin=admin-key-2026
traffic.keys.default-operator=operator-key-2026
traffic.keys.default-emergency=dispatch-key-2026

# Static Resources
quarkus.http.static-resources.index-page=index.html
