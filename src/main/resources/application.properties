# HTTP Port configuration (dynamically uses $PORT for Cloud Run/Cloud, fallback 7860)
quarkus.http.port=${PORT:7860}
quarkus.http.host=0.0.0.0

# Swagger UI & OpenAPI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, x-api-key, X-API-KEY
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD

# Default Seed API Keys
traffic.keys.default-admin=admin-key-2026
traffic.keys.default-operator=operator-key-2026
traffic.keys.default-emergency=dispatch-key-2026

# Static Resources
quarkus.http.static-resources.index-page=index.html
